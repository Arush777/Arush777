<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="term-title term-desc" xml:space="preserve">
<title id="term-title">Arush Sharma</title>
<desc id="term-desc">A terminal window. whoami prints Arush Sharma. cat moat.txt prints: I make models faster. Research and engineering is my moat.</desc>
<!--
  Timeline (CSS only, plays once, then static; final cursor blinks forever):
    0.55-1.00s  type "whoami"        1.30s  Arush Sharma      1.38s  prompt
    1.80-2.72s  type "cat moat.txt"  3.00s  moat.txt output   3.08s  prompt + cursor
  Base styles are the final frame, so prefers-reduced-motion just drops the animations.
  .k  hidden until its animation-duration ends (line or keystroke appears)
  .c  cursor cell, visible only between its animation-delay and delay+duration
  .g  invisible copy of the text before the cursor, so the block lands on the
      exact next cell in whatever monospace font the viewer has
-->
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.ttl{font-size:13px;fill:#6f6b64}
.p{font-size:21px;fill:#ece8e1}
.u{fill:#19c6a5}
.s{fill:#857f76}
.h{fill:#8fe6d3}
.n{font-size:62px;font-weight:700;letter-spacing:-1.5px;fill:#f7f5f0}
.o{font-size:23px;fill:#cfcac1}
.a{font-weight:700;fill:#19c6a5}
.m{fill:#8fe6d3}
.g{visibility:hidden}
.k{animation:off 1s step-end}
.c{visibility:hidden;fill:#19c6a5;animation:on 1s step-end}
.z{fill:#19c6a5;animation:off 3.08s step-end,blink 1.1s step-end 3.08s infinite}
@keyframes off{from,to{visibility:hidden}}
@keyframes on{from,to{visibility:visible}}
@keyframes blink{50%{visibility:hidden}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
  <clipPath id="term-win"><rect width="1000" height="300" rx="10"/></clipPath>
</defs>

<!-- window -->
<g clip-path="url(#term-win)">
  <rect width="1000" height="300" fill="#121211"/>
  <rect width="1000" height="34" fill="#191817"/>
  <path d="M0 34.5H1000" stroke="#262422"/>
</g>
<rect x=".5" y=".5" width="999" height="299" rx="9.5" fill="none" stroke="#2c2a27"/>
<circle cx="20" cy="17" r="6" fill="#ff5f57"/>
<circle cx="40" cy="17" r="6" fill="#febc2e"/>
<circle cx="60" cy="17" r="6" fill="#28c840"/>
<text class="ttl" x="500" y="21.5" text-anchor="middle">arush@dhanbad: ~</text>

<!-- $ whoami -->
<text class="p" x="36" y="78"><tspan class="u">arush@dhanbad</tspan><tspan class="s">:</tspan><tspan class="h">~</tspan><tspan class="s">$ </tspan><tspan class="k" style="animation-duration:.55s">w</tspan><tspan class="k" style="animation-duration:.64s">h</tspan><tspan class="k" style="animation-duration:.72s">o</tspan><tspan class="k" style="animation-duration:.83s">a</tspan><tspan class="k" style="animation-duration:.91s">m</tspan><tspan class="k" style="animation-duration:1s">i</tspan></text>
<text class="p c" x="36" y="78" style="animation-delay:0s;animation-duration:.55s"><tspan class="g">arush@dhanbad:~$ </tspan>&#x2588;</text>
<text class="p c" x="36" y="78" style="animation-delay:.55s;animation-duration:.09s"><tspan class="g">arush@dhanbad:~$ w</tspan>&#x2588;</text>
<text class="p c" x="36" y="78" style="animation-delay:.64s;animation-duration:.08s"><tspan class="g">arush@dhanbad:~$ wh</tspan>&#x2588;</text>
<text class="p c" x="36" y="78" style="animation-delay:.72s;animation-duration:.11s"><tspan class="g">arush@dhanbad:~$ who</tspan>&#x2588;</text>
<text class="p c" x="36" y="78" style="animation-delay:.83s;animation-duration:.08s"><tspan class="g">arush@dhanbad:~$ whoa</tspan>&#x2588;</text>
<text class="p c" x="36" y="78" style="animation-delay:.91s;animation-duration:.09s"><tspan class="g">arush@dhanbad:~$ whoam</tspan>&#x2588;</text>
<text class="p c" x="36" y="78" style="animation-delay:1s;animation-duration:.3s"><tspan class="g">arush@dhanbad:~$ whoami</tspan>&#x2588;</text>
<text class="n k" x="34" y="146" style="animation-duration:1.3s">Arush Sharma</text>

<!-- $ cat moat.txt -->
<text class="p k" x="36" y="190" style="animation-duration:1.38s"><tspan class="u">arush@dhanbad</tspan><tspan class="s">:</tspan><tspan class="h">~</tspan><tspan class="s">$ </tspan><tspan class="k" style="animation-duration:1.8s">c</tspan><tspan class="k" style="animation-duration:1.88s">a</tspan><tspan class="k" style="animation-duration:1.95s">t</tspan><tspan class="k" style="animation-duration:2.05s"> </tspan><tspan class="k" style="animation-duration:2.17s">m</tspan><tspan class="k" style="animation-duration:2.25s">o</tspan><tspan class="k" style="animation-duration:2.33s">a</tspan><tspan class="k" style="animation-duration:2.4s">t</tspan><tspan class="k" style="animation-duration:2.5s">.</tspan><tspan class="k" style="animation-duration:2.57s">t</tspan><tspan class="k" style="animation-duration:2.64s">x</tspan><tspan class="k" style="animation-duration:2.72s">t</tspan></text>
<text class="p c" x="36" y="190" style="animation-delay:1.38s;animation-duration:.42s"><tspan class="g">arush@dhanbad:~$ </tspan>&#x2588;</text>
<text class="p c" x="36" y="190" style="animation-delay:1.8s;animation-duration:.08s"><tspan class="g">arush@dhanbad:~$ c</tspan>&#x2588;</text>
<text class="p c" x="36" y="190" style="animation-delay:1.88s;animation-duration:.07s"><tspan class="g">arush@dhanbad:~$ ca</tspan>&#x2588;</text>
<text class="p c" x="36" y="190" style="animation-delay:1.95s;animation-duration:.1s"><tspan class="g">arush@dhanbad:~$ cat</tspan>&#x2588;</text>
<text class="p c" x="36" y="190" style="animation-delay:2.05s;animation-duration:.12s"><tspan class="g">arush@dhanbad:~$ cat </tspan>&#x2588;</text>
<text class="p c" x="36" y="190" style="animation-delay:2.17s;animation-duration:.08s"><tspan class="g">arush@dhanbad:~$ cat m</tspan>&#x2588;</text>
<text class="p c" x="36" y="190" style="animation-delay:2.25s;animation-duration:.08s"><tspan class="g">arush@dhanbad:~$ cat mo</tspan>&#x2588;</text>
<text class="p c" x="36" y="190" style="animation-delay:2.33s;animation-duration:.07s"><tspan class="g">arush@dhanbad:~$ cat moa</tspan>&#x2588;</text>
<text class="p c" x="36" y="190" style="animation-delay:2.4s;animation-duration:.1s"><tspan class="g">arush@dhanbad:~$ cat moat</tspan>&#x2588;</text>
<text class="p c" x="36" y="190" style="animation-delay:2.5s;animation-duration:.07s"><tspan class="g">arush@dhanbad:~$ cat moat.</tspan>&#x2588;</text>
<text class="p c" x="36" y="190" style="animation-delay:2.57s;animation-duration:.07s"><tspan class="g">arush@dhanbad:~$ cat moat.t</tspan>&#x2588;</text>
<text class="p c" x="36" y="190" style="animation-delay:2.64s;animation-duration:.08s"><tspan class="g">arush@dhanbad:~$ cat moat.tx</tspan>&#x2588;</text>
<text class="p c" x="36" y="190" style="animation-delay:2.72s;animation-duration:.28s"><tspan class="g">arush@dhanbad:~$ cat moat.txt</tspan>&#x2588;</text>
<text class="o k" x="36" y="226" style="animation-duration:3s">I make models <tspan class="a">faster</tspan>. Research and engineering is my <tspan class="m">moat</tspan>.</text>

<!-- idle prompt -->
<text class="p k" x="36" y="266" style="animation-duration:3.08s"><tspan class="u">arush@dhanbad</tspan><tspan class="s">:</tspan><tspan class="h">~</tspan><tspan class="s">$ </tspan></text>
<text class="p z" x="36" y="266"><tspan class="g">arush@dhanbad:~$ </tspan>&#x2588;</text>
